<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background base rounded shield -->
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  
  <!-- Outer Gold Rim -->
  <path d="M 256,40 C 370,40 430,90 430,220 C 430,360 256,470 256,470 C 256,470 82,360 82,220 C 82,90 142,40 256,40 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)"/>
        
  <!-- Inner Red Shield -->
  <path d="M 256,58 C 352,58 406,102 406,220 C 406,344 256,446 256,446 C 256,446 106,344 106,220 C 106,102 160,58 256,58 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Crossed Firefighter Axes -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Axe 1 -->
    <line x1="140" y1="360" x2="372" y2="128" stroke="#ca8a04" stroke-width="16"/>
    <path d="M 350,110 L 395,95 L 410,135 L 375,150 Z" fill="#e2e8f0" stroke="#94a3b8"/>
    <path d="M 345,120 L 325,100" stroke="#cbd5e1" stroke-width="8"/>

    <!-- Axe 2 -->
    <line x1="372" y1="360" x2="140" y2="128" stroke="#ca8a04" stroke-width="16"/>
    <path d="M 162,110 L 117,95 L 102,135 L 137,150 Z" fill="#e2e8f0" stroke="#94a3b8"/>
    <path d="M 167,120 L 187,100" stroke="#cbd5e1" stroke-width="8"/>
  </g>

  <!-- Central Star / Diamond Crest (CBMMG inspired) -->
  <circle cx="256" cy="245" r="95" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="256" cy="245" r="78" fill="#ffffff" opacity="0.1"/>

  <!-- Flame in the Center -->
  <path d="M 256,170 C 275,205 305,235 305,268 C 305,296 283,318 256,318 C 229,318 207,296 207,268 C 207,242 225,225 240,210 C 242,228 254,242 265,242 C 265,242 248,220 256,170 Z" 
        fill="url(#flameGrad)" filter="url(#shadow)"/>
        
  <!-- Inner White Torch/Core -->
  <path d="M 256,260 C 263,275 272,285 272,295 C 272,305 264,312 256,312 C 248,312 240,305 240,295 C 240,285 249,275 256,260 Z" 
        fill="#ffffff" opacity="0.9"/>

  <!-- Firefighter Helmet Silhouette on top -->
  <g transform="translate(196, 60) scale(0.48)">
    <path d="M 40,80 Q 125,20 210,80 Q 240,110 240,130 Q 125,115 10,130 Q 10,110 40,80 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="6"/>
    <rect x="90" y="45" width="70" height="45" rx="10" fill="#dc2626" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="125" cy="68" r="10" fill="#fde047"/>
  </g>

  <!-- Ribbon text banner at bottom -->
  <path d="M 120,400 L 256,415 L 392,400 L 372,445 L 256,460 L 140,445 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>
  <text x="256" y="435" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle" letter-spacing="3">10 ANDARES</text>
</svg>
